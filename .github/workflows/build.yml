name: Build APK

on:
  push:
    branches: [main, 'v2*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Your private signing key (Settings -> Secrets and variables -> Actions).
      # If these aren't set yet, the release APK is signed with the old shared key.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      # Version 2 onwards must be signed with your own key: stop instead of
      # silently falling back to the old shared key.
      - name: Require own signing key for 2.x
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MAJOR=${VERSION%%.*}
          if [ "$MAJOR" -ge 2 ] && [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Version $VERSION needs your own signing key. Add the 4 SIGNING_* secrets (Settings -> Secrets and variables -> Actions), then re-run."
            exit 1
          fi

      - name: Decode signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release (optimised) and debug APKs
        run: gradle assembleRelease assembleDebug

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/auto-lyrics-${{ steps.version.outputs.name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/auto-lyrics-${{ steps.version.outputs.name }}-debug.apk
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Release APK signed with your private key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release APK signed with the OLD shared key (signing secrets not set)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK (install this one)
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-${{ steps.version.outputs.name }}
          path: out/auto-lyrics-${{ steps.version.outputs.name }}.apk

      - name: Upload debug APK (backup)
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-${{ steps.version.outputs.name }}-debug
          path: out/auto-lyrics-${{ steps.version.outputs.name }}-debug.apk

      # Publish a GitHub Release automatically the first time a new version
      # number is built on main (or when a v* tag is pushed).
      - name: Check if this version is already released
        id: released
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.name }} already exists - skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.released.outputs.exists == 'false' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: out/auto-lyrics-${{ steps.version.outputs.name }}.apk
          name: Auto Lyrics ${{ steps.version.outputs.name }}
          body_path: .github/RELEASE_NOTES.md
          make_latest: true
